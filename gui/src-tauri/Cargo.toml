[package]
name = "oursecret-gui"
version = "0.1.0"
description = "GUI (Tauri) del port Linux/Windows de OurSecret — reimplementación clean-room"
authors = ["D4vRAM369"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gui_lib"
# Solo escritorio: staticlib (iOS) y cdylib (Android) pesaban ~1 GB por build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
oursecret-core = { path = "../../core" }
zeroize = "1"
