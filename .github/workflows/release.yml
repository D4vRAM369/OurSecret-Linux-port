name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cargo build --release -p oursecret-cli
      - name: Empaquetar GUI (.deb y .AppImage)
        working-directory: gui
        run: |
          npm ci
          npx tauri build
      - name: Preparar artefactos Linux
        run: |
          mkdir -p dist-linux
          cp target/release/oursecret dist-linux/oursecret-linux-x86_64
          cp target/release/bundle/deb/*.deb dist-linux/
          cp target/release/bundle/appimage/*.AppImage dist-linux/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-linux/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p oursecret-cli -p oursecret-gui
      - name: Preparar artefactos Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Copy-Item target/release/oursecret.exe dist-windows/oursecret-windows-x86_64.exe
          Copy-Item target/release/oursecret-gui.exe dist-windows/oursecret-gui-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-windows/*

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generar checksums SHA-256
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
