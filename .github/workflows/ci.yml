name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Tauri usa WebKitGTK en Linux: sin estas cabeceras no compila oursecret-gui.
      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Comprobar sintaxis del frontend JS
        run: |
          node --check gui/src/main.js
          node --check gui/src/i18n.js
      - name: Comprobar que el HTML cumple la CSP (sin scripts ni handlers inline)
        run: |
          if grep -nP '<script(?![^>]*\bsrc=)|\son[a-z]+\s*=|javascript:' gui/src/index.html; then
            echo "ERROR: script o manejador inline detectado en gui/src/index.html (viola CSP)"
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Los tests también aquí: rutas y create_new se comportan distinto en Windows.
      - run: cargo test -p oursecret-core
      # Target MSVC (el por defecto en Windows): WebView2Loader va enlazado
      # estático, así que el .exe de la GUI no necesita la DLL al lado.
      - run: cargo build --release -p oursecret-cli -p oursecret-gui
      - uses: actions/upload-artifact@v4
        with:
          name: oursecret-windows
          path: |
            target/release/oursecret.exe
            target/release/oursecret-gui.exe
